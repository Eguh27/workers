name: Render Menfess

# Cron Render: claim job queued → render gambar (headless Chrome, markup & CSS
# menyalin preview situs) → upload Cloudinary. TIDAK menyentuh Instagram.
#
# Dua workflow terpisah (render.yml + publish.yml) dengan concurrency group
# berbeda supaya proses render Chrome tidak memblokir jadwal publish.
#
# permissions minimal: contents:read (checkout) + environment secrets.

on:
  # Render instan: dipicu API /api/fess setiap ada submit baru
  repository_dispatch:
    types: [render-now]
  schedule:
    # Jaring pengaman untuk job yang dispatch-nya gagal/terlewat.
    # Render bisa lebih sering (5 menit) karena tidak memanggil API IG.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-menfess
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secret produksi disimpan sebagai environment secrets milik environment
    # `secrets`. Tanpa deklarasi ini job tidak bisa melihatnya dan berhenti di
    # "Environment DATABASE_URL belum diset". Environment-nya tanpa protection
    # rule, jadi tidak menambah gerbang approval.
    environment: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Font emoji untuk render headless Chrome (teks fess bisa memuat emoji).
      # Chrome sendiri sudah terpasang di runner ubuntu-latest.
      - name: Install emoji font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji

      # render-entry.ts + assets/templates.css → src/render-bundle.js
      - name: Build render bundle
        run: npm run render:bundle

      - name: Render queued menfess
        run: npx tsx src/render-worker.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}