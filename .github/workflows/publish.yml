name: Publish Menfess

# Publish: claim job rendered → publish ke Instagram Graph API.
# TIDAK memerlukan Chrome/render — hanya IG API + DB + Cloudinary URL
# yang sudah siap dari Cron Render.
#
# Dua workflow terpisah dengan concurrency group berbeda supaya publish
# tidak terblokir render Chrome.
#
# Pemicu utama adalah `repository_dispatch` yang ditembak /api/fess tiap ada
# submit baru — event yang sama (`render-now`) juga didengar render.yml.
# Alasan: scheduler GitHub (`schedule`) nyatanya cuma menjalankan ~1% jadwal
# di akun ini, jadi publish tidak boleh bergantung padanya. Render dan publish
# sama-sama reaktif terhadap satu event; publish hanya menyentuh row yang
# sudah berstatus `rendered`, jadi tidak ada tabrakan dengan render.
#
# permissions minimal: contents:read (checkout) + environment secrets.

on:
  # Pemicu andal: tiap submit baru dari situs.
  repository_dispatch:
    types: [render-now]
  schedule:
    # Cadangan best-effort: berguna saat tidak ada submit sama sekali
    # (mis. dini hari), tapi jangan diandalkan.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-menfess
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secret produksi disimpan sebagai environment secrets milik environment
    # `secrets`. Tanpa deklarasi ini job tidak bisa melihatnya dan berhenti di
    # "Environment DATABASE_URL belum diset".
    environment: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tidak ada render-bundle, tidak ada Chrome, tidak ada font emoji.
      # src/publish.ts hanya butuh DB + IG token (Cloudinary URL sudah di DB).

      - name: Publish rendered menfess
        run: npx tsx src/publish.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Tanpa tiga baris ini `notify.ts` tidak akan pernah mengirim link
          # Waiting Room, walau secret-nya sudah diisi di environment `secrets`.
          # Kosong = no-op (aman).
          WAITROOM_SECRET: ${{ secrets.WAITROOM_SECRET }}
          WAITROOM_BASE_URL: ${{ secrets.WAITROOM_BASE_URL }}
          WAITROOM_WEBHOOK_URL: ${{ secrets.WAITROOM_WEBHOOK_URL }}